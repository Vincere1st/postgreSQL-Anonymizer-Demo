services:

  db: 
    image: registry.gitlab.com/dalibo/postgresql_anonymizer:stable
    environment:
     POSTGRES_PASSWORD: postgres
     POSTGRES_USER: postgres
    networks:
      - postgresql_anonymizer
    ports:
      - "55432:5432"
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

  api:
    image: node:24-alpine
    working_dir: /app
    volumes:
      - ./api:/app
    tty: true
    command: npm run dev
    networks:
      - postgresql_anonymizer
    ports:
      - "3000:3000"
    depends_on:
      - db
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:55432/boutique

  slidev:
    image: node:24-alpine
    working_dir: /slidev
    tty: true
    stdin_open: true
    user: 1000:1000
    command: npm run dev
    volumes:
      - ./slides:/slidev
    networks:
      - postgresql_anonymizer
    ports:
      - "3030:3030"
    depends_on:
      - api

networks:
  postgresql_anonymizer: