services:

  db:
    image: registry.gitlab.com/dalibo/postgresql_anonymizer:stable
    environment:
      POSTGRES_PASSWORD: postgres
    command: ["postgres", "-c", "wal_level=logical"]   # pour la demo replica
    ports: ["5432:5432"]
    volumes:
      - ./init:/docker-entrypoint-initdb.d:ro
      - ./reset.sql:/reset.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "psql -U postgres -d boutique -tc 'select 1'"]
      interval: 3s
      retries: 20
  slidev:
    image: node:24-alpine
    working_dir: /slidev
    tty: true
    stdin_open: true
    user: 1000:1000
    command: npm run dev
    volumes:
      - ./slides:/slidev
    networks:
      - postgresql_anonymizer
    ports:
      - "3030:3030"

networks:
  postgresql_anonymizer: